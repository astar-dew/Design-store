# --- 축 5: 표현 레이어 (단일값) ---
color:
  - light-neutral
  - dark-neutral
  - dark-neon
  - duotone
  - high-contrast
  - pastel
  - earth
  - brand-mono

density:
  - low
  - medium
  - high

motion:
  - none
  - subtle             # 150~250ms, ease-out, 이동 8px 이내
  - expressive         # 스프링, 패럴랙스, 페이지 트랜지션

# --- 판정 (단일값) ---
verdict:
  - 좋음
  - 참고만
  - 반면교사
