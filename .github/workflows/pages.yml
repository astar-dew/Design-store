# main 에 push 하면 빌드해서 GitHub Pages 로 배포한다.
# 생성물(index.html 등)은 커밋하지 않으므로 여기서 매번 다시 만든다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 대비 검사 실패 시 여기서 멈춘다
      - run: scripts/build.sh
      - run: rm -rf .git .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
